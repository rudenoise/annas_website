<svg viewBox="0 85 660 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two mid-century lounge chairs facing each other on a rug, with a leafy plant to the right">
  <!-- rug -->
  <ellipse cx="322" cy="340" rx="292" ry="44" fill="#6E8278" fill-opacity="0.4"/>
  <ellipse cx="322" cy="336" rx="262" ry="36" fill="#6E8278" fill-opacity="0.3"/>

  <!-- ===================== a single lounge chair, facing right ===================== -->
  <!-- To reuse it facing left, it is drawn again below, mirrored. -->
  <g transform="translate(35,72)" stroke-linecap="round" stroke-linejoin="round">
    <!-- back leg (behind cushions) -->
    <path d="M78,170 L57,254" fill="none" stroke="#384438" stroke-width="10"/>
    <!-- backrest cushion -->
    <path d="M70,176 L62,82 Q60,62 82,60 L104,57 Q120,55 121,74 L125,160 Q126,176 109,178 L86,180 Q70,181 70,176 Z"
          fill="#E4C5B2" stroke="#6E8278" stroke-opacity="0.35" stroke-width="2"/>
    <!-- seat cushion -->
    <path d="M68,168 L182,150 Q198,148 200,163 L203,181 Q205,197 189,199 L82,207 Q65,208 64,193 L65,180 Q66,170 68,168 Z"
          fill="#EBD6C8" stroke="#6E8278" stroke-opacity="0.35" stroke-width="2"/>
    <!-- front legs -->
    <path d="M86,201 L77,257" fill="none" stroke="#384438" stroke-width="10"/>
    <path d="M196,197 L216,257" fill="none" stroke="#384438" stroke-width="10"/>
    <!-- near armrest / frame -->
    <path d="M116,72 C166,74 197,108 203,176" fill="none" stroke="#384438" stroke-width="11"/>
    <!-- white piping accents -->
    <path d="M71,84 Q72,70 84,68" fill="none" stroke="#FBF7F0" stroke-width="2.4" stroke-opacity="0.6"/>
    <path d="M72,86 L80,166" fill="none" stroke="#FBF7F0" stroke-width="2.4" stroke-opacity="0.6"/>
    <path d="M74,183 L184,166" fill="none" stroke="#FBF7F0" stroke-width="2.4" stroke-opacity="0.6"/>
  </g>

  <!-- ===================== the same chair, mirrored, facing left ===================== -->
  <g transform="translate(607,72) scale(-1,1)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,170 L57,254" fill="none" stroke="#384438" stroke-width="10"/>
    <path d="M70,176 L62,82 Q60,62 82,60 L104,57 Q120,55 121,74 L125,160 Q126,176 109,178 L86,180 Q70,181 70,176 Z"
          fill="#E4C5B2" stroke="#6E8278" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M68,168 L182,150 Q198,148 200,163 L203,181 Q205,197 189,199 L82,207 Q65,208 64,193 L65,180 Q66,170 68,168 Z"
          fill="#EBD6C8" stroke="#6E8278" stroke-opacity="0.35" stroke-width="2"/>
    <path d="M86,201 L77,257" fill="none" stroke="#384438" stroke-width="10"/>
    <path d="M196,197 L216,257" fill="none" stroke="#384438" stroke-width="10"/>
    <path d="M116,72 C166,74 197,108 203,176" fill="none" stroke="#384438" stroke-width="11"/>
    <path d="M71,84 Q72,70 84,68" fill="none" stroke="#FBF7F0" stroke-width="2.4" stroke-opacity="0.6"/>
    <path d="M72,86 L80,166" fill="none" stroke="#FBF7F0" stroke-width="2.4" stroke-opacity="0.6"/>
    <path d="M74,183 L184,166" fill="none" stroke="#FBF7F0" stroke-width="2.4" stroke-opacity="0.6"/>
  </g>

  <!-- ===================== plant, off to the right ===================== -->
  <g transform="translate(602,150)" stroke-linecap="round" stroke-linejoin="round">
    <!-- foliage -->
    <g transform="translate(0,150)">
      <path d="M0,0 C13,-27 13,-66 0,-94 C-13,-66 -13,-27 0,0 Z" transform="rotate(-40)" fill="#6E8278"/>
      <path d="M0,0 C13,-27 13,-66 0,-94 C-13,-66 -13,-27 0,0 Z" transform="rotate(-19)" fill="#55685C"/>
      <path d="M0,0 C12,-26 12,-70 0,-100 C-12,-70 -12,-26 0,0 Z" transform="rotate(0)" fill="#384438"/>
      <path d="M0,0 C13,-27 13,-66 0,-94 C-13,-66 -13,-27 0,0 Z" transform="rotate(19)" fill="#55685C"/>
      <path d="M0,0 C13,-27 13,-66 0,-94 C-13,-66 -13,-27 0,0 Z" transform="rotate(40)" fill="#6E8278"/>
    </g>
    <!-- pot -->
    <path d="M-22,151 L22,151 L17,203 L-17,203 Z" fill="#E4C5B2"/>
    <rect x="-27" y="142" width="54" height="13" rx="3" fill="#EBD6C8"/>
  </g>
</svg>
